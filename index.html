<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Kos Dashboard</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Paho MQTT Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #090a0f;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 440px;
            background: linear-gradient(145deg, rgba(30, 32, 47, 0.9), rgba(20, 22, 33, 0.95));
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header-title {
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f1f5f9;
        }

        .header-title i {
            color: #38bdf8;
            font-size: 1.3rem;
        }

        .status-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .status-badge.connected {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border-color: rgba(52, 211, 153, 0.3);
        }

        /* Grid System */
        .sensor-grid, .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 20px;
        }

        .control-grid {
            margin-bottom: 0;
        }

        /* Sensor Box */
        .sensor-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.2s ease;
        }

        .sensor-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.05);
        }

        .sensor-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .temp-icon { background: rgba(244, 63, 94, 0.15); color: #fb7185; }
        .hum-icon { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }

        .sensor-label {
            font-size: 0.7rem;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sensor-value {
            font-size: 1.3rem;
            font-weight: 800;
            color: #f8fafc;
            margin-top: 2px;
        }

        /* Buttons */
        .btn-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .btn-card:hover {
            background: rgba(255, 255, 255, 0.07);
        }

        .btn-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #64748b;
            transition: all 0.3s ease;
        }

        .btn-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #e2e8f0;
        }

        .btn-status {
            font-size: 0.68rem;
            font-weight: 700;
            color: #64748b;
        }

        /* Active Glow Effects */
        .btn-card.active-lamp1 {
            border-color: rgba(251, 191, 36, 0.5);
            background: rgba(251, 191, 36, 0.05);
        }
        .btn-card.active-lamp1 .btn-icon {
            background: #fbbf24;
            color: #0f172a;
            box-shadow: 0 0 18px rgba(251, 191, 36, 0.7);
        }

        .btn-card.active-lamp2 {
            border-color: rgba(168, 85, 247, 0.5);
            background: rgba(168, 85, 247, 0.05);
        }
        .btn-card.active-lamp2 .btn-icon {
            background: #c084fc;
            color: #0f172a;
            box-shadow: 0 0 18px rgba(192, 132, 252, 0.7);
        }

        .btn-card.active-lamp1 .btn-status,
        .btn-card.active-lamp2 .btn-status {
            color: #f1f5f9;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">
                <i class="fa-solid fa-house-signal"></i> Smart Room
            </div>
            <div id="statusBadge" class="status-badge">
                <i class="fa-solid fa-circle-dot"></i> <span id="statusText">CONNECTING</span>
            </div>
        </div>

        <!-- Sensor Section -->
        <div class="sensor-grid">
            <div class="sensor-card">
                <div class="sensor-icon temp-icon">
                    <i class="fa-solid fa-temperature-half"></i>
                </div>
                <div>
                    <div class="sensor-label">Suhu</div>
                    <div class="sensor-value"><span id="valSuhu">--</span> °C</div>
                </div>
            </div>

            <div class="sensor-card">
                <div class="sensor-icon hum-icon">
                    <i class="fa-solid fa-droplet"></i>
                </div>
                <div>
                    <div class="sensor-label">Kelembapan</div>
                    <div class="sensor-value"><span id="valHum">--</span> %</div>
                </div>
            </div>
        </div>

        <!-- Control Section -->
        <div class="control-grid">
            <div id="btnLampu1" class="btn-card" onclick="toggleLampu(1)">
                <div class="btn-icon">
                    <i class="fa-solid fa-lightbulb"></i>
                </div>
                <div class="btn-title">Lampu Utama</div>
                <div id="txtLampu1" class="btn-status">MATI</div>
            </div>

            <div id="btnLampu2" class="btn-card" onclick="toggleLampu(2)">
                <div class="btn-icon">
                    <i class="fa-solid fa-moon"></i>
                </div>
                <div class="btn-title">Lampu Tidur</div>
                <div id="txtLampu2" class="btn-status">MATI</div>
            </div>
        </div>
    </div>

    <script>
        // --- KONFIGURASI HIVEMQ (SUDAH DISESUAIKAN KREDENSIAL KAMU) ---
        const MQTT_HOST = "0934d4c052d7448db90141635738c6c1.s1.eu.hivemq.cloud";
        const MQTT_PORT = 8884; // WebSocket Secure Port untuk Browser
        const MQTT_USER = "ahmad";
        const MQTT_PASS = "Ahmad12.";

        let stateLampu1 = false;
        let stateLampu2 = false;

        const clientId = "WebClient_" + Math.random().toString(16).substr(2, 8);
        const client = new Paho.MQTT.Client(MQTT_HOST, MQTT_PORT, clientId);

        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;

        connectBroker();

        function connectBroker() {
            client.connect({
                onSuccess: onConnect,
                onFailure: onFailure,
                useSSL: true,
                userName: MQTT_USER,
                password: MQTT_PASS,
                keepAliveInterval: 30
            });
        }

        function onConnect() {
            document.getElementById("statusBadge").classList.add("connected");
            document.getElementById("statusText").innerText = "ONLINE";

            client.subscribe("suhu");
            client.subscribe("kelembapan");
            client.subscribe("OUTPUT/LED");
            client.subscribe("OUTPUT/LED1");
        }

        function onFailure(response) {
            document.getElementById("statusBadge").classList.remove("connected");
            document.getElementById("statusText").innerText = "FAILED";
            setTimeout(connectBroker, 5000);
        }

        function onConnectionLost(responseObject) {
            document.getElementById("statusBadge").classList.remove("connected");
            document.getElementById("statusText").innerText = "DISCONNECTED";
            if (responseObject.errorCode !== 0) {
                setTimeout(connectBroker, 5000);
            }
        }

        function onMessageArrived(message) {
            const topic = message.destinationName;
            const payload = message.payloadString.trim();

            if (topic === "suhu") {
                document.getElementById("valSuhu").innerText = payload;
            } else if (topic === "kelembapan") {
                document.getElementById("valHum").innerText = payload;
            } else if (topic === "OUTPUT/LED") {
                stateLampu1 = (payload === "ON");
                updateUI(1, stateLampu1);
            } else if (topic === "OUTPUT/LED1") {
                stateLampu2 = (payload === "ON1");
                updateUI(2, stateLampu2);
            }
        }

        function toggleLampu(lampNum) {
            let topic, payload;

            if (lampNum === 1) {
                topic = "OUTPUT/LED";
                payload = stateLampu1 ? "OFF" : "ON";
            } else if (lampNum === 2) {
                topic = "OUTPUT/LED1";
                payload = stateLampu2 ? "OFF1" : "ON1";
            }

            const message = new Paho.MQTT.Message(payload);
            message.destinationName = topic;
            message.retained = true;
            client.send(message);
        }

        function updateUI(lampNum, isOn) {
            const btn = document.getElementById("btnLampu" + lampNum);
            const txt = document.getElementById("txtLampu" + lampNum);

            if (lampNum === 1) {
                if (isOn) {
                    btn.classList.add("active-lamp1");
                    txt.innerText = "MENYALA";
                } else {
                    btn.classList.remove("active-lamp1");
                    txt.innerText = "MATI";
                }
            } else if (lampNum === 2) {
                if (isOn) {
                    btn.classList.add("active-lamp2");
                    txt.innerText = "MENYALA";
                } else {
                    btn.classList.remove("active-lamp2");
                    txt.innerText = "MATI";
                }
            }
        }
    </script>
</body>
</html>
