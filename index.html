<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Room Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
</head>
<body>

    <main class="dashboard-container">
        <header class="header">
            <div class="header-title">
                <i class="fa-solid fa-house-signal"></i> 
                <span>Smart Room</span>
            </div>
            <div id="statusBadge" class="status-badge">
                <i class="fa-solid fa-circle-dot"></i> 
                <span id="statusText">CONNECTING</span>
            </div>
        </header>

        <section class="sensor-grid">
            <div class="sensor-card">
                <div class="sensor-icon temp-icon">
                    <i class="fa-solid fa-temperature-half"></i>
                </div>
                <div class="sensor-info">
                    <span class="sensor-label">Suhu</span>
                    <div class="sensor-value"><span id="valSuhu">--</span> °C</div>
                </div>
            </div>

            <div class="sensor-card">
                <div class="sensor-icon hum-icon">
                    <i class="fa-solid fa-droplet"></i>
                </div>
                <div class="sensor-info">
                    <span class="sensor-label">Kelembapan</span>
                    <div class="sensor-value"><span id="valHum">--</span> %</div>
                </div>
            </div>
        </section>

        <section class="control-grid">
            <button id="btnLampu1" class="btn-card" onclick="toggleLampu(1)">
                <div class="btn-icon">
                    <i class="fa-solid fa-lightbulb"></i>
                </div>
                <span class="btn-title">Lampu Utama</span>
                <span id="txtLampu1" class="btn-status">MATI</span>
            </button>

            <button id="btnLampu2" class="btn-card" onclick="toggleLampu(2)">
                <div class="btn-icon">
                    <i class="fa-solid fa-moon"></i>
                </div>
                <span class="btn-title">Lampu Tidur</span>
                <span id="txtLampu2" class="btn-status">MATI</span>
            </button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
